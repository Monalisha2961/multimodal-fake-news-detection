<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake News Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--fake:#ff3b5c;--real:#00e5a0;--text:#e8e8f0;--muted:#5a5a7a;--accent:#6c63ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;background-image:radial-gradient(ellipse at 20% 20%,rgba(108,99,255,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,229,160,.05) 0%,transparent 50%)}
.header{text-align:center;margin-bottom:48px}
.badge{display:inline-block;background:rgba(108,99,255,.15);border:1px solid rgba(108,99,255,.3);color:#9d96ff;font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:6px 16px;border-radius:20px;margin-bottom:20px}
h1{font-family:'Syne',sans-serif;font-size:clamp(32px,6vw,56px);font-weight:800;line-height:1.1;background:linear-gradient(135deg,#fff 0%,#9d96ff 50%,#00e5a0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.subtitle{color:var(--muted);font-size:13px;letter-spacing:1px}
.card{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;margin-bottom:24px}
.label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;padding:16px;resize:vertical;outline:none;transition:border-color .2s;line-height:1.6}
textarea:focus{border-color:var(--accent)}
#title{min-height:100px;margin-bottom:20px}
#comment{min-height:70px;margin-bottom:20px}
.modality-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.modality-pill{padding:4px 12px;border-radius:20px;font-size:11px;letter-spacing:1px;border:1px solid}
.pill-text{background:rgba(108,99,255,.15);color:#9d96ff;border-color:rgba(108,99,255,.3)}
.pill-image{background:rgba(0,229,160,.1);color:var(--real);border-color:rgba(0,229,160,.3)}
.pill-image.inactive{background:rgba(90,90,122,.1);color:var(--muted);border-color:var(--border)}
.pill-comment{background:rgba(108,99,255,.15);color:#9d96ff;border-color:rgba(108,99,255,.3)}
.optional-tag{background:rgba(0,229,160,.1);color:var(--real);font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:1px;margin-left:8px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px}
.upload-area:hover{border-color:var(--accent)}
.upload-area.has-image{border-color:var(--real);border-style:solid}
.upload-area.dragover{border-color:var(--accent);background:rgba(108,99,255,.05)}
#image-input{display:none}
.upload-icon{font-size:28px;margin-bottom:10px}
.upload-text{font-size:13px;color:var(--muted)}
.upload-text span{color:var(--accent)}
#preview-wrap{display:none;position:relative}
#image-preview{width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-bottom:8px}
.remove-btn{position:absolute;top:8px;right:8px;background:rgba(255,59,92,.85);border:none;border-radius:50%;width:28px;height:28px;color:#fff;font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.img-name{font-size:11px;color:var(--real);letter-spacing:1px;text-align:center}
.btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--accent),#9d96ff);border:none;border-radius:12px;color:#fff;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.result-card{width:100%;max-width:720px;border-radius:20px;padding:36px;display:none;border:1px solid var(--border);animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.result-card.fake{background:rgba(255,59,92,.08);border-color:rgba(255,59,92,.3)}
.result-card.real{background:rgba(0,229,160,.08);border-color:rgba(0,229,160,.3)}
.verdict{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;margin-bottom:8px}
.verdict.fake{color:var(--fake)}
.verdict.real{color:var(--real)}
.confidence-text{color:var(--muted);font-size:13px;margin-bottom:28px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;align-items:center;gap:14px}
.bar-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;width:40px;flex-shrink:0}
.bar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1);width:0%}
.bar-fill.fake{background:var(--fake)}
.bar-fill.real{background:var(--real)}
.bar-pct{font-size:13px;width:46px;text-align:right;flex-shrink:0}
.modalities-used{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);letter-spacing:1px}
.spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="badge">RoBERTa + ResNet-50 · Fakeddit · SOA University</div>
  <h1>Fake News<br>Detector</h1>
  <p class="subtitle">Multimodal Deep Learning · Section 21 · Group 13</p>
</div>

<div class="card">
  <div class="modality-row">
    <div class="modality-pill pill-text">TEXT</div>
    <div class="modality-pill pill-image inactive" id="pill-image">IMAGE</div>
    <div class="modality-pill pill-comment">COMMENTS</div>
  </div>

  <span class="label">News Headline / Article Title</span>
  <textarea id="title" placeholder="Paste or type a news headline here..."></textarea>

  <span class="label">News Image <span class="optional-tag">OPTIONAL</span></span>
  <div class="upload-area" id="upload-area"
    onclick="document.getElementById('image-input').click()"
    ondragover="handleDragOver(event)"
    ondragleave="handleDragLeave(event)"
    ondrop="handleDrop(event)">
    <input type="file" id="image-input" accept="image/*" onchange="handleImageSelect(event)">
    <div id="upload-placeholder">
      <div class="upload-icon">🖼️</div>
      <div class="upload-text">Drag &amp; drop image here or <span>browse</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">JPG · PNG · GIF · WEBP</div>
    </div>
    <div id="preview-wrap">
      <img id="image-preview" src="" alt="Preview">
      <button class="remove-btn" onclick="removeImage(event)">×</button>
      <div class="img-name" id="img-name"></div>
    </div>
  </div>

  <span class="label">User Comments (optional)</span>
  <textarea id="comment" placeholder="Add any comments or reactions to this news..."></textarea>

  <button class="btn" onclick="analyze()" id="btn">
    <span id="btn-text">Analyze News</span>
    <div class="spinner" id="spinner"></div>
  </button>
</div>

<div class="result-card" id="result">
  <div class="verdict" id="verdict-text"></div>
  <div class="confidence-text" id="conf-text"></div>
  <div class="bars">
    <div class="bar-row">
      <span class="bar-label" style="color:var(--fake)">FAKE</span>
      <div class="bar-track"><div class="bar-fill fake" id="bar-fake"></div></div>
      <span class="bar-pct" id="pct-fake"></span>
    </div>
    <div class="bar-row">
      <span class="bar-label" style="color:var(--real)">REAL</span>
      <div class="bar-track"><div class="bar-fill real" id="bar-real"></div></div>
      <span class="bar-pct" id="pct-real"></span>
    </div>
  </div>
  <div class="modalities-used" id="modalities-used"></div>
</div>

<script>
let selectedFile = null;

function handleImageSelect(e) {
  const file = e.target.files[0];
  if(file) showPreview(file);
}
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('upload-area').classList.add('dragover');
}
function handleDragLeave(e) {
  document.getElementById('upload-area').classList.remove('dragover');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-area').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')) showPreview(file);
}
function showPreview(file) {
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('image-preview').src = e.target.result;
    document.getElementById('img-name').textContent = file.name;
    document.getElementById('upload-placeholder').style.display = 'none';
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('upload-area').classList.add('has-image');
    document.getElementById('pill-image').classList.remove('inactive');
  };
  reader.readAsDataURL(file);
}
function removeImage(e) {
  e.stopPropagation();
  selectedFile = null;
  document.getElementById('image-input').value = '';
  document.getElementById('upload-placeholder').style.display = 'block';
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-area').classList.remove('has-image');
  document.getElementById('pill-image').classList.add('inactive');
}
async function analyze() {
  const title = document.getElementById('title').value.trim();
  const comment = document.getElementById('comment').value.trim();
  if(!title) { alert('Please enter a news headline!'); return; }

  const btn = document.getElementById('btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('spinner');
  const result = document.getElementById('result');

  btn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';
  result.style.display = 'none';

  try {
    const formData = new FormData();
    formData.append('title', title);
    formData.append('comment', comment);
    if(selectedFile) formData.append('image', selectedFile);

    const resp = await fetch('/predict', {method:'POST', body:formData});
    const data = await resp.json();
    if(data.error) { alert(data.error); return; }

    const isFake = data.label === 'FAKE';
    result.className = `result-card ${isFake ? 'fake' : 'real'}`;
    document.getElementById('verdict-text').textContent = isFake ? 'FAKE NEWS' : 'REAL NEWS';
    document.getElementById('verdict-text').className = `verdict ${isFake ? 'fake' : 'real'}`;
    document.getElementById('conf-text').textContent = `${data.confidence}% confidence in this prediction`;
    document.getElementById('pct-fake').textContent = `${data.fake_prob}%`;
    document.getElementById('pct-real').textContent = `${data.real_prob}%`;

    const modUsed = ['Text'];
    if(selectedFile) modUsed.push('Image (ResNet-50)');
    if(comment) modUsed.push('Comments');
    document.getElementById('modalities-used').textContent = 'Modalities used: ' + modUsed.join(' + ');

    result.style.display = 'block';
    setTimeout(() => {
      document.getElementById('bar-fake').style.width = `${data.fake_prob}%`;
      document.getElementById('bar-real').style.width = `${data.real_prob}%`;
    }, 100);
  } catch(e) {
    alert('Error connecting to server. Make sure app.py is running!');
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}
document.addEventListener('keydown', e => { if(e.ctrlKey && e.key==='Enter') analyze(); });
</script>
</body>
</html>
